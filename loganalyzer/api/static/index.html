<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Аналізатор логів</title>
</head>
<body bgcolor="#eeeeee">

<!-- ===== Сторінка входу ===== -->
<div id="login">
  <br><br>
  <table align="center" border="1" cellpadding="10" cellspacing="0" bgcolor="#ffffff">
    <tr>
      <td colspan="2" align="center" bgcolor="#cccccc"><b>Вхід</b></td>
    </tr>
    <tr>
      <td>Логін:</td>
      <td><input id="u" type="text"></td>
    </tr>
    <tr>
      <td>Пароль:</td>
      <td><input id="p" type="password"></td>
    </tr>
    <tr>
      <td colspan="2" align="center"><button onclick="login()">Увійти</button></td>
    </tr>
    <tr>
      <td colspan="2" align="center"><font color="red"><span id="loginErr"></span></font></td>
    </tr>
  </table>
</div>

<!-- ===== Основна сторінка ===== -->
<div id="app" hidden>
  <table width="95%" align="center" border="1" cellpadding="8" cellspacing="0" bgcolor="#ffffff">

    <!-- шапка -->
    <tr bgcolor="#cccccc">
      <td width="25%"><b>Аналізатор логів</b></td>
      <td align="center">
        <button id="b_incidents" onclick="openTab('incidents')">Інциденти</button>
        <button id="b_rules" onclick="openTab('rules')">Правила</button>
        <button id="b_analytics" onclick="openTab('analytics')">Аналітика</button>
      </td>
      <td width="25%" align="right">
        <span id="who"></span>
        <button onclick="logout()">Вийти</button>
      </td>
    </tr>

    <!-- рядок для повідомлень -->
    <tr id="msgRow" hidden>
      <td colspan="3" id="msg"></td>
    </tr>

    <!-- вміст вкладок -->
    <tr>
      <td colspan="3">
        <div id="tab-incidents"></div>
        <div id="tab-rules" hidden></div>
        <div id="tab-analytics" hidden></div>
      </td>
    </tr>

  </table>
</div>

<script>
var token = sessionStorage.getItem("token") || "";
var role = sessionStorage.getItem("role") || "";
var user = sessionStorage.getItem("user") || "";
var ruleNames = {};
var state = { status: "", offset: 0, limit: 10 };

function canChange() {
  return role === "analyst" || role === "admin";
}

function $(s) {
  return document.querySelector(s);
}

// захист від підстановки html у текст
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function fmt(d) {
  return d ? d.replace("T", " ").slice(0, 16) : "";
}

function statusColor(s) {
  if (s === "open") return "#ff9999";
  if (s === "acknowledged") return "#ffff99";
  return "#99ff99";
}

function show(text, ok) {
  $("#msg").textContent = text;
  $("#msg").bgColor = ok === false ? "#ffcccc" : "#ccffcc";
  $("#msgRow").hidden = false;
  setTimeout(function () { $("#msgRow").hidden = true; }, 5000);
}

async function api(path, opt) {
  opt = opt || {};
  var headers = { Authorization: "Bearer " + token };
  if (typeof opt.body === "string") headers["Content-Type"] = "application/json";
  var r = await fetch(path, Object.assign({}, opt, { headers: headers }));
  if (r.status === 401) { logout(); throw new Error("Увійдіть знову"); }
  var data = await r.json().catch(function () { return {}; });
  if (!r.ok) {
    var d = data.detail;
    throw new Error(typeof d === "string" ? d : JSON.stringify(d));
  }
  return data;
}

// ---------- Вхід і вихід ----------
async function login() {
  $("#loginErr").textContent = "";
  var body = new URLSearchParams({ username: $("#u").value, password: $("#p").value });
  var r = await fetch("/auth/login", { method: "POST", body: body });
  var data = await r.json().catch(function () { return {}; });
  if (!r.ok) {
    $("#loginErr").textContent = data.detail || "Помилка входу";
    return;
  }
  token = data.access_token;
  role = data.role;
  user = $("#u").value;
  sessionStorage.setItem("token", token);
  sessionStorage.setItem("role", role);
  sessionStorage.setItem("user", user);
  start();
}

function logout() {
  sessionStorage.clear();
  token = "";
  role = "";
  $("#app").hidden = true;
  $("#login").hidden = false;
}

async function start() {
  $("#login").hidden = true;
  $("#app").hidden = false;
  $("#who").textContent = user + " (" + role + ")";
  var rules = await api("/rules");
  ruleNames = {};
  rules.forEach(function (r) { ruleNames[r.id] = r.name; });
  openTab("incidents");
}

// ---------- Вкладки ----------
function openTab(name) {
  var tabs = ["incidents", "rules", "analytics"];
  tabs.forEach(function (t) {
    $("#tab-" + t).hidden = (t !== name);
    $("#b_" + t).disabled = (t === name);
  });
  if (name === "incidents") loadIncidents();
  if (name === "rules") loadRules();
  if (name === "analytics") loadAnalytics();
}

// ---------- Інциденти ----------
async function loadIncidents() {
  try {
    var q = new URLSearchParams({ limit: state.limit, offset: state.offset });
    if (state.status) q.set("status", state.status);
    var page = await api("/incidents?" + q);

    var rows = "";
    page.items.forEach(function (i) {
      var buttons = '<button onclick="details(' + i.id + ')">Деталі</button> ';
      if (canChange() && i.status === "open")
        buttons += '<button onclick="act(' + i.id + ",'acknowledge')\">В роботу</button> ";
      if (canChange() && i.status !== "closed")
        buttons += '<button onclick="act(' + i.id + ",'close')\">Закрити</button>";
      rows +=
        "<tr>" +
        "<td>" + i.id + "</td>" +
        '<td bgcolor="' + statusColor(i.status) + '">' + i.status + "</td>" +
        "<td>" + esc(i.ip) + "</td>" +
        "<td>" + fmt(i.window_start) + "</td>" +
        "<td>" + i.entries_count + "</td>" +
        "<td>" + esc(ruleNames[i.rule_id] || i.rule_id) + "</td>" +
        "<td>" + buttons + "</td>" +
        "</tr>";
    });
    if (rows === "") rows = '<tr><td colspan="7">Інцидентів нема</td></tr>';

    var from = page.total ? page.offset + 1 : 0;
    var to = Math.min(page.offset + page.limit, page.total);
    var options = "";
    ["", "open", "acknowledged", "closed"].forEach(function (s) {
      options += '<option value="' + s + '"' + (s === state.status ? " selected" : "") + ">" +
        (s || "усі") + "</option>";
    });

    $("#tab-incidents").innerHTML =
      '<table width="100%" cellpadding="5" cellspacing="0">' +
      "<tr>" +
      "<td>Статус: " +
      '<select onchange="state.status=this.value;state.offset=0;loadIncidents()">' + options + "</select></td>" +
      '<td align="center">Показано ' + from + "-" + to + " з " + page.total + "</td>" +
      '<td align="right">' +
      '<button ' + (page.offset === 0 ? "disabled" : "") + ' onclick="state.offset-=state.limit;loadIncidents()">Назад</button> ' +
      '<button ' + (to >= page.total ? "disabled" : "") + ' onclick="state.offset+=state.limit;loadIncidents()">Далі</button>' +
      "</td></tr></table>" +
      '<table width="100%" border="1" cellpadding="5" cellspacing="0">' +
      '<tr bgcolor="#dddddd"><th>№</th><th>Статус</th><th>IP</th><th>Вікно (UTC)</th><th>Записів</th><th>Правило</th><th>Дії</th></tr>' +
      rows +
      "</table>" +
      '<br><div id="details"></div>';
  } catch (e) {
    show(e.message, false);
  }
}

async function act(id, what) {
  try {
    var opt = { method: "POST" };
    if (what === "close") {
      var note = prompt("Коментар (можна залишити порожнім):");
      if (note === null) return;
      opt.body = JSON.stringify({ note: note || null });
    }
    await api("/incidents/" + id + "/" + what, opt);
    show("Інцидент №" + id + ": готово");
    loadIncidents();
  } catch (e) {
    show(e.message, false);
    loadIncidents();
  }
}

async function details(id) {
  try {
    var d = await api("/incidents/" + id);
    var i = d.incident;
    var rows = "";
    d.sample_entries.forEach(function (e) {
      rows +=
        "<tr><td>" + fmt(e.timestamp) + "</td><td>" + e.status + "</td><td>" +
        esc(e.method) + "</td><td>" + esc(e.path.slice(0, 90)) + "</td></tr>";
    });
    $("#details").innerHTML =
      '<table width="100%" border="1" cellpadding="5" cellspacing="0">' +
      '<tr bgcolor="#dddddd"><td colspan="4"><b>Інцидент №' + i.id + ": " + esc(d.rule_name) + "</b></td></tr>" +
      '<tr><td colspan="4">IP: <b>' + esc(i.ip) + "</b>, статус: " + i.status +
      ", записів: " + i.entries_count +
      (i.note ? "<br>Примітка: " + esc(i.note) : "") + "</td></tr>" +
      '<tr bgcolor="#eeeeee"><th>Час (UTC)</th><th>Статус</th><th>Метод</th><th>Шлях</th></tr>' +
      rows +
      "</table>";
    $("#details").scrollIntoView();
  } catch (e) {
    show(e.message, false);
  }
}

// ---------- Правила ----------
async function loadRules() {
  try {
    var list = await api("/rules");
    var form = "";
    if (canChange()) {
      form =
        '<table border="1" cellpadding="5" cellspacing="0" bgcolor="#f5f5f5">' +
        '<tr bgcolor="#dddddd"><td colspan="2"><b>Нове правило</b></td></tr>' +
        "<tr><td>Назва:</td><td><input id=\"r_name\" size=\"40\"></td></tr>" +
        "<tr><td>Тип:</td><td><select id=\"r_type\">" +
        '<option value="path_regex">path_regex (шлях)</option>' +
        '<option value="status_burst">status_burst (статуси)</option>' +
        '<option value="user_agent">user_agent (текст)</option>' +
        "</select></td></tr>" +
        "<tr><td>Значення:</td><td><input id=\"r_value\" size=\"40\"> " +
        "<br><small>вираз / статуси через кому / текст</small></td></tr>" +
        '<tr><td>Вікно (хв):</td><td><input id="r_win" type="number" value="60" min="1" max="1440" size="6"></td></tr>' +
        '<tr><td>Поріг:</td><td><input id="r_hits" type="number" value="1" min="1" size="6"></td></tr>' +
        '<tr><td colspan="2" align="center">' +
        '<button onclick="createRule()">Створити</button> ' +
        '<button onclick="runDetect()">Перевірити логи за правилами</button>' +
        "</td></tr></table><br>";
    }

    var rows = "";
    list.forEach(function (r) {
      rows +=
        "<tr><td>" + r.id + "</td><td>" + esc(r.name) + "</td><td>" + r.rule_type +
        "</td><td>" + r.window_minutes + " хв</td><td>" + esc(JSON.stringify(r.params)) + "</td></tr>";
    });

    $("#tab-rules").innerHTML =
      form +
      '<table width="100%" border="1" cellpadding="5" cellspacing="0">' +
      '<tr bgcolor="#dddddd"><th>№</th><th>Назва</th><th>Тип</th><th>Вікно</th><th>Параметри</th></tr>' +
      rows +
      "</table>";
  } catch (e) {
    show(e.message, false);
  }
}

async function createRule() {
  var type = $("#r_type").value;
  var v = $("#r_value").value.trim();
  var body = {
    name: $("#r_name").value,
    rule_type: type,
    window_minutes: +$("#r_win").value,
    min_hits: +$("#r_hits").value
  };
  if (type === "path_regex") body.pattern = v;
  if (type === "user_agent") body.contains = v;
  if (type === "status_burst") {
    body.statuses = v.split(",").map(function (s) { return parseInt(s); })
      .filter(function (n) { return !isNaN(n); });
  }
  try {
    var r = await api("/rules", { method: "POST", body: JSON.stringify(body) });
    ruleNames[r.id] = r.name;
    show("Правило «" + r.name + "» створено");
    loadRules();
  } catch (e) {
    show(e.message, false);
  }
}

async function runDetect() {
  try {
    var res = await api("/detect", { method: "POST" });
    show(res.map(function (r) {
      return r.rule_name + ": нових " + r.incidents_created + ", вже було " + r.incidents_existing;
    }).join(" | "));
  } catch (e) {
    show(e.message, false);
  }
}

// ---------- Аналітика ----------
async function loadAnalytics() {
  try {
    var ips = await api("/analytics/top-ips?limit=10");
    var st = await api("/analytics/statuses");
    var max = 1;
    st.forEach(function (s) { if (s.count > max) max = s.count; });

    var ipRows = "";
    ips.forEach(function (r) {
      ipRows += "<tr><td>" + esc(r.ip) + "</td><td>" + r.requests + "</td></tr>";
    });
    var stRows = "";
    st.forEach(function (r) {
      var pct = Math.round(r.count / max * 100);
      stRows +=
        "<tr><td>" + r.status + "</td><td>" + r.count + "</td><td width=\"60%\">" +
        '<table width="' + pct + '%" height="12" bgcolor="#6699ff" cellspacing="0" cellpadding="0"><tr><td></td></tr></table>' +
        "</td></tr>";
    });

    $("#tab-analytics").innerHTML =
      '<table width="100%" border="1" cellpadding="5" cellspacing="0">' +
      '<tr bgcolor="#dddddd"><td colspan="2"><b>Топ-10 IP за кількістю запитів</b></td></tr>' +
      '<tr bgcolor="#eeeeee"><th>IP</th><th>Запитів</th></tr>' + ipRows +
      "</table><br>" +
      '<table width="100%" border="1" cellpadding="5" cellspacing="0">' +
      '<tr bgcolor="#dddddd"><td colspan="3"><b>Відповіді сервера за статусами</b></td></tr>' +
      '<tr bgcolor="#eeeeee"><th>Статус</th><th>Кількість</th><th></th></tr>' + stRows +
      "</table>";
  } catch (e) {
    show(e.message, false);
  }
}

$("#p").addEventListener("keydown", function (e) {
  if (e.key === "Enter") login();
});

if (token) {
  start().catch(function () { logout(); });
}
</script>
</body>
</html>
